<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Test Translate</title>
</head>
<body>
  <h1>مرحبا بك في التطبيق</h1>
  <button onclick="setLang('en')">English</button>
  <button onclick="setLang('ar')">العربية</button>
  
  <div id="google_translate_element" style="display:none;"></div>
  
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({pageLanguage: 'ar', includedLanguages: 'ar,en', autoDisplay: false}, 'google_translate_element');
    }
  </script>
  <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

  <script>
    function setLang(lang) {
      document.cookie = `googtrans=/ar/${lang}; path=/`;
      document.cookie = `googtrans=/ar/${lang}; path=/; domain=${location.hostname}`;
      window.location.reload();
    }
  </script>
</body>
</html>
